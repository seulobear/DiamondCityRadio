<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="ui.css" />
  <title>Pip-Boy Radio</title>
</head>
<body>
  <div class="screen">
    <nav>
      <span>Stat</span>
      <span>Inv</span>
      <span>Data</span>
      <span>Map</span>
      <span class="active">Radio</span>
    </nav>

    <div class="radio-content">
      <ul class="station-list">
        <li data-station="/station/diamondcity">Diamond City Radio</li>
        <li aria-disabled="true">Distress Signal</li>
        <li aria-disabled="true">Emergency Frequency RJ1138</li>
        <li aria-disabled="true">Military Frequency AF95</li>
      </ul>

      <canvas id="wave-canvas" width="128" height="128"></canvas>
    </div>

    <div class="volume-control">
      <label for="volumeSlider">Volume</label>
      <input type="range" id="volumeSlider" min="0" max="100" value="100">
      <button id="muteBtn">Mute</button>
    </div>

    <audio></audio>
    <footer></footer>
  </div>

  <script>
    const stations = [
      ["Diamond City Radio", "/station/diamondcity"]
    ];

    const player = document.querySelector("audio");
    const list = document.querySelector(".station-list");

    const removeSelection = () =>
      list.querySelector(".active")?.classList.remove("active");
    const setSelection = (url) =>
      list.querySelector(`[data-station="${url}"]`)?.classList.add("active");

    function playUrl(url) {
      if (player.getAttribute("data-src") === url) {
        removeSelection();
        player.removeAttribute("data-src");
        player.src = "";
      } else {
        removeSelection();
        setSelection(url);
        player.setAttribute("data-src", url);
        player.src = url;
      }
    }

    list.addEventListener("click", (event) => {
      const target = event.target;
      if (!target.hasAttribute("data-station")) return;
      playUrl(target.getAttribute("data-station"));
    });

    player.addEventListener("canplay", () => player.play());

    // Waveform
    const canvas = document.getElementById("wave-canvas");
    const ctx = canvas.getContext("2d");
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 1024;

    const source = audioContext.createMediaElementSource(player);
    source.connect(analyser);
    analyser.connect(audioContext.destination);

    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);

    function drawWaveform() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      analyser.getByteTimeDomainData(dataArray);
      ctx.strokeStyle = "#00ff00";
      ctx.lineWidth = 1;
      ctx.beginPath();
      const sliceWidth = canvas.width / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        let y = (dataArray[i] / 255) * canvas.height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += sliceWidth;
      }
      ctx.stroke();
      requestAnimationFrame(drawWaveform);
    }

    player.addEventListener("play", () => {
      audioContext.resume();
      requestAnimationFrame(drawWaveform);
    });

    // Volume Control
    const slider = document.getElementById("volumeSlider");
    const muteBtn = document.getElementById("muteBtn");
    const savedVolume = localStorage.getItem("volume");
    if (savedVolume) {
      slider.value = savedVolume;
      player.volume = savedVolume / 100;
    } else player.volume = slider.value / 100;

    slider.addEventListener("input", () => {
      player.volume = slider.value / 100;
      localStorage.setItem("volume", slider.value);
    });

    muteBtn.addEventListener("click", () => {
      player.muted = !player.muted;
      muteBtn.textContent = player.muted ? "Unmute" : "Mute";
    });
  </script>
</body>
</html>
